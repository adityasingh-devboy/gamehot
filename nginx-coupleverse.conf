# NGINX Configuration for CoupleVerse
# Place in: /etc/nginx/sites-available/coupleverse
# Symlink: ln -s /etc/nginx/sites-available/coupleverse /etc/nginx/sites-enabled/

server {
    listen 80;
    server_name your-coupleverse-domain.com; # Replace with your domain

    # Redirect all HTTP traffic to HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name your-coupleverse-domain.com; # Replace with your domain

    # SSL Certificates (managed automatically by Certbot)
    ssl_certificate /etc/letsencrypt/live/your-coupleverse-domain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/your-coupleverse-domain.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Maximum upload size for couple photos (Max 10MB to accommodate 5MB files)
    client_max_body_size 10M;

    # SECURITY: Strictly block any direct public access to private_uploads folder
    location /private_uploads {
        deny all;
        return 403;
    }

    # Proxy all traffic to the Node.js + Socket.IO server
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # WebSocket support (CRITICAL for real-time multiplayer & chat)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Forward real client IP and host
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts for persistent WebSockets
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}

